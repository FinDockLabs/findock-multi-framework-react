<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment received · Your company</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="./"><img src="logo.svg" alt="">Your company</a>
            <span class="secure">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                Secure checkout
            </span>
        </div>
    </header>

    <main class="thanks">
        <div class="check"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h1>Payment received</h1>
        <p>Thank you. Your payment has been received and is being processed. A confirmation is on its way to your inbox.</p>
        <p class="small">You can close this page.</p>
    </main>

    <footer class="site-footer">
        <div class="container">
            <span>© 2026 Your company · A fictional company for a FinDock demo</span>
            <span>Payments powered by FinDock</span>
        </div>
    </footer>
    <!-- Demo only: the "Example" bar with links to the other examples. Remove this line on your own site. -->
    <script type="module" src="shared/example-bar.js"></script>
</body>
</html>
