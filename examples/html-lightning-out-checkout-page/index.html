<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Secure checkout · Your company</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="./"><img src="logo.svg" alt="">Your company</a>
            <span class="secure">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                Secure checkout
            </span>
        </div>
    </header>

    <main class="container">
        <div class="checkout-embed">
            <div class="checkout-loading" id="checkout-loading" role="status" aria-live="polite">
                <div class="loading-card" aria-hidden="true">
                    <div class="loading-col">
                        <span class="sk sk-eyebrow"></span>
                        <span class="sk sk-title"></span>
                        <span class="sk sk-sub"></span>
                        <span class="sk sk-line"></span>
                        <span class="sk sk-line short"></span>
                        <span class="sk sk-line"></span>
                        <span class="sk sk-line short"></span>
                    </div>
                    <div class="loading-col right">
                        <span class="sk sk-amount"></span>
                        <span class="sk sk-option tall"></span>
                        <span class="sk sk-option"></span>
                        <span class="sk sk-option"></span>
                        <span class="sk sk-button"></span>
                    </div>
                </div>
                <p class="loading-text">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                    <span id="loading-message">Loading secure checkout…</span>
                </p>
            </div>
            <!-- checkout.js adds the Lightning Out app and c-invoice-pay-flow. -->
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <span>© 2026 Your company · A fictional company for a FinDock demo</span>
            <span>Payments powered by FinDock</span>
        </div>
    </footer>

    <script type="module" src="checkout.js"></script>
    <!-- Demo only: the "Example" bar with links to the other examples. Remove this line on your own site. -->
    <script type="module" src="shared/example-bar.js"></script>
</body>
</html>
